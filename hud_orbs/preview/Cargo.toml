[package]
name = "book_preview"
version = "0.1.0"
edition = "2021"
publish = false

# A Linux build of the spellbook (book.rs, pages.rs, layout.rs, font.rs) that renders it to PNG with a small software
# rasterizer, to check the pages without the game. Not part of the DLL.
[workspace]

[dependencies]
imgui = "0.12.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
texture2ddecoder = "0.1.2"
tracing = "0.1"
hudhook = { path = "hudhook_shim" }
