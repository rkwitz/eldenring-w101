[package]
name = "w101_orbs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
eldenring = "0.14.0"
from-singleton = "3.0.1"
hudhook = "0.9.3"
image = { version = "0.25", default-features = false, features = ["png"] }
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm"] }
texture2ddecoder = "0.1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Media", "Win32_Media_Audio", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
panic = "abort"
strip = true

# hudhook with RenderContext::capture_screen added (vendor/hudhook, changes marked "w101_orbs:").
[patch.crates-io]
hudhook = { path = "vendor/hudhook" }
